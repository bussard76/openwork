name: build-desktop
run-name: "Build OpenWork Desktop (${{ github.ref_name }})"

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build CLI
        run: ./packages/opencode/script/build.ts
        env:
          OPENCODE_VERSION: "0.5.0"
          OPENCODE_RELEASE: ""
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-cli
          path: packages/opencode/dist

  build-tauri:
    needs: build-cli
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
            name: macOS-arm64
            cli: opencode-darwin-arm64
          - host: macos-latest
            target: x86_64-apple-darwin
            name: macOS-x64
            cli: opencode-darwin-x64
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows-x64
            cli: opencode-windows-x64
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
          shared-key: ${{ matrix.settings.target }}

      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          name: opencode-cli
          path: packages/desktop/src-tauri/target/opencode-binaries/opencode-cli

      - name: Copy CLI sidecar (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p packages/desktop/src-tauri/sidecars
          TARGET=${{ matrix.settings.target }}
          CLI=${{ matrix.settings.cli }}
          SRC="packages/desktop/src-tauri/target/opencode-binaries/opencode-cli/${CLI}/bin/opencode"
          DEST="packages/desktop/src-tauri/sidecars/opencode-cli-${TARGET}"
          cp "$SRC" "$DEST"
          chmod +x "$DEST"

      - name: Copy CLI sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path packages/desktop/src-tauri/sidecars
          $TARGET = "${{ matrix.settings.target }}"
          $CLI = "${{ matrix.settings.cli }}"
          $SRC = "packages/desktop/src-tauri/target/opencode-binaries/opencode-cli/${CLI}/bin/opencode.exe"
          $DEST = "packages/desktop/src-tauri/sidecars/opencode-cli-${TARGET}.exe"
          Copy-Item $SRC $DEST

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: packages/desktop
          tauriScript: bunx tauri
          args: --target ${{ matrix.settings.target }} --config ./src-tauri/tauri.openwork.conf.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Ad-hoc sign macOS app
        if: runner.os == 'macOS'
        run: |
          APP="packages/desktop/src-tauri/target/${{ matrix.settings.target }}/release/bundle/macos/OpenWork.app"
          codesign --deep --force --sign - "$APP"

      - name: Repackage DMG with signed app
        if: runner.os == 'macOS'
        run: |
          TARGET=${{ matrix.settings.target }}
          BUNDLE="packages/desktop/src-tauri/target/${TARGET}/release/bundle"
          DMG=$(find "$BUNDLE/dmg" -name "*.dmg" | head -1)
          APP="$BUNDLE/macos/OpenWork.app"
          TMP=$(mktemp -d)
          cp -r "$APP" "$TMP/"
          NEW_DMG="${DMG%.dmg}-signed.dmg"
          hdiutil create -volname "OpenWork" -srcfolder "$TMP" -ov -format UDZO "$NEW_DMG"
          rm "$DMG"
          mv "$NEW_DMG" "$DMG"
          rm -rf "$TMP"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwork-desktop-${{ matrix.settings.name }}
          path: |
            packages/desktop/src-tauri/target/${{ matrix.settings.target }}/release/bundle/**/*.dmg
            packages/desktop/src-tauri/target/${{ matrix.settings.target }}/release/bundle/**/*.exe
            packages/desktop/src-tauri/target/${{ matrix.settings.target }}/release/bundle/**/*.msi
          if-no-files-found: warn

  publish-release:
    needs: build-tauri
    runs-on: ubuntu-latest
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: openwork-desktop-*
          path: release-artifacts
          merge-multiple: false

      - name: Collect release files
        run: |
          mkdir -p dist
          find release-artifacts -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.msi" \) -exec cp {} dist/ \;

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.0
          name: OpenWork v0.5.0
          draft: false
          prerelease: false
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ github.token }}
